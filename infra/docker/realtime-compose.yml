services:
  rideforge-realtime:
    build:
      context: ../..
      dockerfile: infra/docker/server.Dockerfile
    container_name: rideforge-realtime
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      REVENUECAT_API_KEY: ${REVENUECAT_API_KEY}
      CHECKOUT_SUCCESS_URL: ${CHECKOUT_SUCCESS_URL}
      CHECKOUT_CANCEL_URL: ${CHECKOUT_CANCEL_URL}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE}
      OTP_PROVIDER_MODE: ${OTP_PROVIDER_MODE:-live}
      OTP_EXPOSE_DEV_CODES: ${OTP_EXPOSE_DEV_CODES:-false}
      OTP_REQUIRE_LIVE_PROVIDERS: ${OTP_REQUIRE_LIVE_PROVIDERS:-true}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
